<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DepthWizard</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d1117;
        --panel: #161b22cc;
        --line: #30363d;
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #58a6ff;
        --warn: #d29922;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
      body {
        font: 13px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
        color: var(--text);
      }
      #canvas { width: 100%; height: 100%; display: block; outline: none; touch-action: none; }

      .panel {
        position: absolute;
        background: var(--panel);
        backdrop-filter: blur(8px);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
      }
      #titlebar { top: 12px; left: 12px; }
      #titlebar h1 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: 0.01em; }
      #titlebar p { margin: 2px 0 0; font-size: 11px; color: var(--muted); }

      /* The units badge. Hard rule 2: relative and absolute are never visually
         confused, and this reads from the scene manifest rather than a local flag. */
      #units {
        top: 12px; right: 12px;
        font-variant-numeric: tabular-nums;
        border-color: var(--warn);
      }
      #units b { color: var(--warn); font-weight: 600; }
      #units.absolute { border-color: var(--accent); }
      #units.absolute b { color: var(--accent); }

      #readout { bottom: 12px; left: 12px; min-width: 200px; }
      #readout dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
      #readout dt { color: var(--muted); }
      #readout dd { margin: 0; font-variant-numeric: tabular-nums; }

      #hint { bottom: 12px; right: 12px; color: var(--muted); font-size: 11px; }
      kbd {
        background: #21262d; border: 1px solid var(--line); border-radius: 3px;
        padding: 0 4px; font: inherit; font-size: 10px;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>

    <div class="panel" id="titlebar">
      <h1>DepthWizard</h1>
      <p>Single-view height estimation &middot; PS 26175</p>
    </div>

    <!-- Starts in the relative state deliberately: metres must be earned from a CRS,
         never assumed by default. -->
    <div class="panel" id="units">
      <b id="units-label">relative &mdash; no metric scale</b>
    </div>

    <div class="panel" id="readout">
      <dl>
        <dt>scene</dt><dd id="r-scene">synthetic placeholder</dd>
        <dt>height</dt><dd id="r-height">&mdash;</dd>
        <dt>camera</dt><dd id="r-camera">orbit</dd>
        <!-- Vertical exaggeration is always shown. Applying it silently would make every
             height on screen a lie; the probe readout is un-exaggerated regardless. -->
        <dt>vert&nbsp;scale</dt><dd id="r-exag">1.0x</dd>
      </dl>
    </div>

    <div class="panel" id="hint">
      <kbd>C</kbd> cycle camera &middot; <kbd>drag</kbd> look &middot; click to probe
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
